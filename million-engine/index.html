<!DOCTYPE html>
<html lang="en" class="splash-on">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>The Million Engine</title>
  <link rel="stylesheet" href="css/tokens.css?v=20260827c">
  <link rel="stylesheet" href="css/base.css?v=20260827a">
  <link rel="stylesheet" href="css/map.css?v=20260827a">
  <link rel="stylesheet" href="css/splash.css?v=20260827a">
  <link rel="stylesheet" href="css/deck.css?v=20260827b">
</head>
<body>
  <!-- L0 Cover -->
  <div class="splash" id="splash" aria-hidden="true">
    <div class="splash-copy">
      <div class="splash-brand">
        <svg class="mark" viewBox="0 0 26 16" aria-hidden="true">
          <circle cx="9" cy="8" r="7" fill="var(--red)"/>
          <circle cx="17" cy="8" r="7" fill="var(--yellow)" style="mix-blend-mode:screen"/>
        </svg>
        <span class="splash-kicker">Mastercard × Erste</span>
      </div>
      <h1 class="splash-title">The <em>1 Million</em> Engine</h1>
      <p class="splash-sub">Connect with people through passions across Erste markets.</p>
      <div class="splash-actions">
        <button type="button" class="splash-start" id="splashStart">Start the engine</button>
      </div>
    </div>
  </div>

  <div class="app" id="app">
    <header class="deck-bar" id="deckBar">
      <div class="deck-brand">
        <svg class="mark" viewBox="0 0 26 16" aria-hidden="true">
          <circle cx="9" cy="8" r="7" fill="var(--red)"/>
          <circle cx="17" cy="8" r="7" fill="var(--yellow)" style="mix-blend-mode:screen"/>
        </svg>
        <span class="deck-wordmark" id="wordmark">The Million Engine</span>
      </div>
      <div class="deck-bar-actions">
        <label class="deck-import">
          Import
          <input type="file" id="importFile" accept="application/json,.json" hidden>
        </label>
        <button type="button" class="ghostbtn" id="restartBtn" hidden>Restart</button>
      </div>
    </header>

    <!-- L1 Map -->
    <main class="stage" id="stage">
      <div class="mapwrap" id="mapwrap">
        <div class="map-atmosphere" aria-hidden="true"></div>
        <svg id="map" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Market map"></svg>
        <div class="peek" id="peek"></div>
        <p class="deck-hint" id="mapHint">Click a country</p>
        <div class="source" id="source">Placeholder deck · Import JSON to fill</div>
      </div>
    </main>

    <!-- L2 Country: cards + focused map -->
    <section class="country-layer" id="countryLayer" aria-hidden="true">
      <button type="button" class="ghostbtn country-back" id="countryBack">Back</button>
      <div class="country-split">
        <div class="country-aside">
          <p class="country-kicker">Sponsoring potentials</p>
          <h2 class="country-title" id="countryTitle">—</h2>
          <p class="country-teaser" id="countryTeaser"></p>
          <div class="topic-cards" id="topicCards"></div>
        </div>
        <div class="country-map-panel">
          <svg id="countryMap" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Selected country"></svg>
        </div>
      </div>
    </section>

    <!-- L3 Offer -->
    <section class="offer-layer" id="offerLayer" aria-hidden="true">
      <div class="offer-toolbar">
        <button type="button" class="ghostbtn" id="offerBack">Back</button>
        <button type="button" class="ghostbtn" id="offerRestart">Restart</button>
      </div>
      <article class="offer-card" id="offerCard">
        <p class="offer-kicker" id="offerKicker">Mastercard offer</p>
        <h2 class="offer-title" id="offerTitle">—</h2>
        <div class="offer-stats">
          <div class="offer-stat">
            <span class="offer-stat-label">Potential</span>
            <span class="offer-stat-value" id="offerPotential">—</span>
          </div>
          <div class="offer-stat">
            <span class="offer-stat-label">Statistic 1</span>
            <span class="offer-stat-value" id="offerStat1">—</span>
          </div>
          <div class="offer-stat">
            <span class="offer-stat-label">Statistic 2</span>
            <span class="offer-stat-value" id="offerStat2">—</span>
          </div>
        </div>
        <div class="offer-body">
          <p id="offerDesc1"></p>
          <p id="offerDesc2"></p>
        </div>
        <div class="offer-chart" id="offerChart">
          <div class="offer-chart-head">
            <p class="offer-chart-title" id="offerChartTitle"></p>
            <p class="offer-chart-caption" id="offerChartCaption"></p>
          </div>
          <div class="offer-chart-bars" id="offerChartBars" role="img" aria-label="Schematic chart"></div>
        </div>
      </article>
    </section>
  </div>

  <script src="js/vendor/d3.min.js"></script>
  <script type="module" src="js/app.js?v=20260827a"></script>
</body>
</html>
